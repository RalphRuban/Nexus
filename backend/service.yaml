apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: nexus-backend
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
    spec:
      containerConcurrency: 80
      volumes:
        - name: firestore-cred
          secret:
            secretName: nexus-firestore-cred
      containers:
        - image: gcr.io/PROJECT_ID/nexus-backend:latest
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: firestore-cred
              mountPath: /secrets
          env:
            - name: USE_FIRESTORE
              value: "true"
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /secrets/firebase-adminsdk.json
            - name: VISION_MODE
              value: "llm"
            - name: AGENT_LLM_MODE
              value: "deterministic"
            - name: FRONTEND_URL
              value: "https://nexus-frontend.vercel.app"
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nexus-secrets
                  key: GOOGLE_API_KEY
          resources:
            limits:
              cpu: "1"
              memory: 1Gi